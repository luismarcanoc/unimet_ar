<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcador de prueba UNIMET AR</title>
  <style>
    @page { size: A4; margin: 15mm; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #081b49; font-family: Arial, sans-serif; }
    main { display: flex; min-height: 250mm; align-items: center; flex-direction: column; justify-content: center; }
    h1 { margin: 0 0 4mm; font-size: 18pt; }
    p { margin: 0 0 7mm; font-size: 10pt; }
    img { display: block; width: 20cm; height: 20cm; image-rendering: pixelated; }
    strong { margin-top: 5mm; font-size: 16pt; }
    .measure { margin-top: 2mm; color: #4c5d7e; }
  </style>
</head>
<body>
  <main>
    <h1>MARCADOR DE PRUEBA UNIMET AR</h1>
    <p>Imprimir a escala 100%, sin ajustar al area de impresion.</p>
    <img src="UNIMET_AR_TEST_MARKER.png" alt="QR CASA-QR-001">
    <strong>CASA-QR-001</strong>
    <p class="measure">El cuadrado completo debe medir exactamente 20 x 20 cm.</p>
  </main>
</body>
</html>
