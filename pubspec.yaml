name: unimet_ar
description: Prototipo Flutter para guia AR interior UNIMET.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  camera: ^0.11.0+2
  csv: 6.0.0
  cupertino_icons: ^1.0.8
  file_picker: 8.1.2
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  geolocator: ^13.0.2
  http: ^1.2.2
  pdfrx: 2.4.8
  google_mlkit_text_recognition: 0.17.1
  mobile_scanner: 7.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/campus_routes.json
    - OCR_horario/data/materias.json
    - OCR_horario/assets/welcome-illustration.png
